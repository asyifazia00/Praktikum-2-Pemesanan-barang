<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Form Elektronics Order</title>
<style>
  :root {
    --bg: #f4f8fa;        
    --surface: #ffffff;
    --ink: #24404f;       
    --muted: #6b8594;
    --line: #d5e2e9;
    --sea: #2f86a6;       
    --sea-dark: #256c88;
    --sea-soft: #e3f0f5;
    --deep: #1f3b4d;      
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14222c;
      --surface: #1a2c38;
      --ink: #dbe8ef;
      --muted: #8fa8b6;
      --line: #2c4252;
      --sea: #5bb0cf;
      --sea-dark: #479bbb;
      --sea-soft: #213847;
      --deep: #101c24;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
    font-size: 1rem;
    line-height: 1.55;
  }

  nav {
    background: var(--deep);
    display: flex;
    flex-wrap: wrap;
    gap: 1.5rem;
    padding: .9rem max(1.5rem, calc((100% - 56rem) / 2));
  }
  nav a {
    color: #b9d3df;
    text-decoration: none;
    padding-bottom: 2px;
    border-bottom: 2px solid transparent;
  }
  nav a:hover, nav a:focus-visible {
    color: #fff;
    border-bottom-color: #5bb0cf;
    outline: none;
  }
  nav a:last-child { margin-left: auto; }

  .page {
    max-width: 56rem;
    margin: 0 auto;
    padding: 2.5rem 1.5rem 4rem;
    display: flex;
    gap: 3rem;
    flex-wrap: wrap;
  }

  .pic { width: 14rem; }
  .pic .img {
    width: 14rem; height: 14rem;
    background: var(--sea-soft);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: var(--sea);
    font-size: .9rem;
  }
  .pic input[type=file] {
    margin-top: 1rem;
    width: 14rem;
    font-size: .8rem;
    color: var(--muted);
  }

  form { flex: 1; min-width: 20rem; }
  .row { display: flex; flex-direction: column; margin-bottom: 1.1rem; }
  .row > label.t { font-size: .85rem; color: var(--muted); margin-bottom: .2rem; }
  .row input[type=text], .row input[type=tel], .row input[type=email],
  .row select, .row textarea {
    width: 100%;
    font: inherit;
    color: var(--ink);
    background: transparent;
    border: 0;
    border-bottom: 1px solid var(--line);
    padding: .4rem 0;
    border-radius: 0;
    transition: border-color .15s;
  }
  .row select { background: var(--bg); }
  .row textarea { resize: vertical; }
  .row input:focus, .row select:focus, .row textarea:focus {
    outline: none;
    border-bottom-color: var(--sea);
    box-shadow: 0 1px 0 var(--sea);
  }
  .note { margin: -.5rem 0 1.4rem; font-size: .85rem; color: var(--muted); }

  .chk { margin: 0 0 1.4rem; }
  .chk label { display: block; padding: .15rem 0; }
  .chk input { accent-color: var(--sea); margin-right: .6rem; }

  button {
    background: var(--sea);
    color: #fff;
    border: 0;
    border-radius: 6px;
    padding: .7rem 1.6rem;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s;
  }
  button:hover, button:focus-visible { background: var(--sea-dark); outline: none; }
  button:focus-visible { box-shadow: 0 0 0 3px var(--sea-soft), 0 0 0 5px var(--sea); }
</style>
</head>
<body>
<nav>
  <a href="#">Home</a><a href="#">Generate Link</a><a href="#">Transaction History</a><a href="#">Policy</a><a href="#">Logout</a>
</nav>

<div class="page">
  <div class="pic">
    <div class="img" role="img" aria-label="Pratinjau gambar barang">Pratinjau gambar</div>
    <input type="file" name="picture" form="orderForm" accept="image/*" aria-label="Upload Picture">
  </div>

  <form id="orderForm" action="../Praktikum 2 hasil pemesanan barang" method="GET">
    <div class="row"><label class="t" for="title">Item information</label>
      <table border="1" cellpadding="5">
        <tr>
            <td style="margin:.4rem 0 .2rem">Nama Barang</td>
            <td>
                <input type="text" name="nama_barang" required>
            </td>
        </tr>

        <tr>
            <td>Kategori</td>
            <td>
                <select name="kategori">
                    <option value="mobile phone">Mobile Phone</option>
                    <option value="laptop">Laptop</option>
                    <option value="smart tv">Smart TV</option>
                </select>
            </td>
        </tr>

        <tr>
            <td>Jumlah</td>
            <td>
                <input type="number" name="jumlah" min="1" value="1">
            </td>
        </tr>

      </table>
      </div>

    <div class="row"><label class="t" for ="description">Description</label>
      <textarea id="description" name="description" rows="5"></textarea></div>
    <div class="row"><label class="t" for="payment method">Payment method</label>
      <select id="payment method" name="payment method">
        <option>Transfer virtual account</option><option>E-Wallet</option><option>Credit card</option>
      </select></div>
    <div class="row"><label class="t" for="holder">Name</label>
      <input type="text" id="holder" name="holder" placeholder="Name Here"></div>
      <div class="row"><label class="t" for="holder">Address</label>
        <input type="text" id="holder" name="holder" placeholder="Fill Here"></div>
    <div class="row"><label class="t" for="transaction">Transaction amount</label>
      <select id="transaction" name="transaction">
        <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
      </select></div>
    <p class="note">* if the transaction is for 3 person, choose 3 from the drop-down list</p>
      
    <div class="chk">
      <p class="note">Please choose your contact information</p>
      <label><input type="checkbox" name="sendphone" value="1" checked>Sent to Mobile phone</label>
      <div class="row"><label class="t" for="phone">Mobile number</label>
        <input type="tel" id="phone" name="phone" placeholder="Fill here"></div>
  
      <label><input type="checkbox" name="sendemail" value="1" checked>Sent to Email</label>
      <div class="row"><label class="t" for="email">Email</label>
        <input type="text" id="email" name="email" placeholder="Fill here"></div>
    </div>

    <button type="submit">Order now</button>
  </form>
</div>
</body>
</html>
